services:
  postgres:
    image: postgres:16
    container_name: orya-postgres
    environment:
      POSTGRES_USER: orya
      POSTGRES_PASSWORD: orya
      POSTGRES_DB: orya
    ports:
      - "5432:5432"
    volumes:
      - orya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orya -d orya"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orya_pgdata:
