# ORYA - clamd.conf du conteneur JETABLE orya-test-clamav (t52u). Copie dans le
# conteneur par scripts/test-files-up.ps1 (docker cp avant demarrage) ; ne modifie
# jamais un clamd global de la machine. Reglages production : docs/antivirus-limites-t52.md.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
# Limites d'epuisement (t52u)
MaxScanTime 20000
MaxFileSize 60M
MaxScanSize 120M
StreamMaxLength 12M
MaxRecursion 10
MaxFiles 1000
# Echec ferme : une limite atteinte est signalee (Heuristics.Limits.Exceeded.* FOUND)
# au lieu d'un "OK" silencieux ; l'API refuse alors le fichier (422).
AlertExceedsMax yes